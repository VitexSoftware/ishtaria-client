name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  deb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install packaging tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends debhelper
      - name: Fetch Godot and export templates
        run: tools/fetch-godot.sh
      - name: Build package
        run: |
          dpkg-buildpackage -us -uc -b
          mkdir -p dist && mv ../*.deb dist/
      - uses: actions/upload-artifact@v4
        with:
          name: deb
          path: dist/*.deb

  desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch Godot and export templates
        run: PLATFORMS="linux-arm64 windows macos" tools/fetch-godot.sh
      - name: Import project
        run: tools/godot/godot --headless --path . --import
      - name: Export Linux arm64, Windows and macOS clients
        run: |
          mkdir -p build
          tools/godot/godot --headless --path . --export-release "Linux arm64" "$PWD/build/ishtaria-client.linux-arm64"
          tools/godot/godot --headless --path . --export-release Windows "$PWD/build/ishtaria-client.windows-x86_64.exe"
          tools/godot/godot --headless --path . --export-release macOS "$PWD/build/ishtaria-client.macos.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: desktop
          path: |
            build/ishtaria-client.linux-arm64
            build/ishtaria-client.windows-x86_64.exe
            build/ishtaria-client.macos.zip
