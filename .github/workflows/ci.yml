name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  deb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install packaging tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends debhelper
      - name: Fetch Godot and export templates
        run: tools/fetch-godot.sh
      - name: Build package
        run: |
          dpkg-buildpackage -us -uc -b
          mkdir -p dist && mv ../*.deb dist/
      - uses: actions/upload-artifact@v4
        with:
          name: deb
          path: dist/*.deb
